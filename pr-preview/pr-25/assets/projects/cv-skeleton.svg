	<!-- name + title -->
	<rect x="234" y="106" width="260" height="26" rx="6" fill="#dcdcda"/>
	<rect x="234" y="146" width="160" height="18" rx="6" fill="#e8e8e6"/>

	<!-- contact chips -->
	<rect x="234" y="182" width="90" height="16" rx="8" fill="#e8e8e6"/>
	<rect x="334" y="182" width="90" height="16" rx="8" fill="#e8e8e6"/>
	<rect x="434" y="182" width="90" height="16" rx="8" fill="#e8e8e6"/>

