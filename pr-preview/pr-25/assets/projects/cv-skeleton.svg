	<rect x="80" y="238" width="1040" height="2" fill="#e2e2e0"/>

	<!-- section: experience -->
	<rect x="80" y="270" width="150" height="20" rx="6" fill="#c9c9c6"/>
	<rect x="80" y="304" width="440" height="16" rx="6" fill="#e2e2e0"/>
	<rect x="80" y="328" width="380" height="16" rx="6" fill="#e2e2e0"/>
	<rect x="80" y="352" width="410" height="16" rx="6" fill="#e2e2e0"/>
	<rect x="80" y="376" width="260" height="16" rx="6" fill="#e2e2e0"/>

	<!-- section: education -->
	<rect x="80" y="424" width="150" height="20" rx="6" fill="#c9c9c6"/>
	<rect x="80" y="458" width="440" height="16" rx="6" fill="#e2e2e0"/>
	<rect x="80" y="482" width="320" height="16" rx="6" fill="#e2e2e0"/>

	<!-- side column: skills -->
	<rect x="620" y="270" width="120" height="20" rx="6" fill="#c9c9c6"/>
	<rect x="620" y="304" width="500" height="16" rx="8" fill="#e2e2e0"/>
	<rect x="620" y="328" width="440" height="16" rx="8" fill="#e2e2e0"/>
	<rect x="620" y="352" width="470" height="16" rx="8" fill="#e2e2e0"/>

	<!-- side column: skill pills -->
	<rect x="620" y="400" width="90" height="26" rx="13" fill="#e8e8e6"/>
	<rect x="720" y="400" width="110" height="26" rx="13" fill="#e8e8e6"/>
